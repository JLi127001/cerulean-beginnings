[project]
name = "cerulean-beginnings"
version = "0.1.0"
description = "Build-scheduling tool for manufacturing assembly, driven by a Step dependency graph and CPM scheduling."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "networkx>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["core", "api"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
